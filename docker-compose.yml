services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wa_studio
      POSTGRES_USER: wa_user
      POSTGRES_PASSWORD: change_me
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wa_user -d wa_studio"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    env_file: .env
    ports: ["3000:3000"]
    depends_on:
      postgres: {condition: service_healthy}
volumes:
  postgres_data:
